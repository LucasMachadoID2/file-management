name: Pipeline CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configuration
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run:  mvn -B clean compile

      - name: Unit tests
        run: mvn -B clean test