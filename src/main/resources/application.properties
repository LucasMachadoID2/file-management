spring.application.name=file-management
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/file-management
spring.datasource.username=${APP_USER_DATABASE:admin}
spring.datasource.password=${APP_PASSWORD_DATABASE:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
app.jwt.secret=699fcaa2-4d89-4dff-aba8-49776421a0f2
app.jwt.expiration-seconds=3600
